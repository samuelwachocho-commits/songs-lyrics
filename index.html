<html lang="en">
<head>

<link rel="apple-touch-icon" href="icon-192.png">

<meta name="mobile-web-app-capable" content="yes">

<style>
:root{--bg:#f4f7f6;--surface:#fff;--ink:#14302d;--mute:#5d726f;--line:#d5e0dd;--brand:#0f3d3a;--on-brand:#fff;--accent:#e0a526;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a19;--surface:#152826;--ink:#e6f0ee;--mute:#92aaa6;--line:#27403d;--brand:#1c5550}}
:root[data-theme="dark"]{--bg:#0d1a19;--surface:#152826;--ink:#e6f0ee;--mute:#92aaa6;--line:#27403d;--brand:#1c5550}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,sans-serif;font-size:16px}
header{background:var(--brand);color:#fff;padding:16px 16px 12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
h1{margin:0;font-family:Literata,Georgia,serif;font-size:26px;font-weight:600}
input,select,textarea,button{font:inherit;color:inherit}
#q{width:100%;padding:11px 14px;border-radius:10px;border:0;background:rgba(255,255,255,.16);color:#fff}
#q::placeholder{color:rgba(255,255,255,.7)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;max-width:100%}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:99px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{padding:0 16px 96px;max-width:720px;margin:0 auto}
.song{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:8px;cursor:pointer}
.song b{font-weight:600}
.num{display:inline-block;min-width:2.2em;color:var(--mute);font-weight:600}
.tag{font-size:13px;color:var(--mute);text-align:right}
.empty{color:var(--mute);text-align:center;padding:40px 10px;line-height:1.5}
#add{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--accent);color:#1a1200;border:0;border-radius:99px;padding:14px 22px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer}
.sheet{position:fixed;inset:0;background:var(--bg);overflow-y:auto;z-index:10;display:none;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.sheet.on{display:block}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 16px;background:var(--brand);color:#fff;position:sticky;top:0;z-index:2}
.bar button,.hb{background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:8px;padding:8px 12px;cursor:pointer}
.bar .sp{flex:1}
.bar input[type=range]{width:90px;accent-color:var(--accent)}
.wrap{padding:20px 20px 60px;max-width:720px;margin:0 auto}
#vt{font-family:Literata,Georgia,serif;font-size:28px;margin:0 0 4px}
#vc{color:var(--mute);margin:0 0 20px}
#vl{font-family:Literata,Georgia,serif;white-space:pre-wrap;line-height:1.7;max-width:60ch;padding-bottom:50vh}
label{display:block;font-weight:600;margin:16px 0 6px}
.f{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
textarea.f{min-height:300px;line-height:1.6;font-family:Literata,Georgia,serif}
.row{display:flex;gap:10px;margin-top:20px}
.row button,.mb{flex:1;padding:13px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;width:100%}
.mb{display:block;margin-bottom:10px;text-align:left}
.row .pri{background:var(--brand);color:#fff;border-color:var(--brand)}
.row .del{color:#c0392b}
.trow{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.trow button{background:none;border:1px solid var(--line);border-radius:8px;padding:4px 10px;cursor:pointer}
.banner{background:var(--surface);border:1px solid var(--accent);border-radius:10px;padding:14px;margin-bottom:12px}
.banner button{display:block;margin-top:10px;background:var(--accent);color:#1a1200;border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}
.ck{display:flex;align-items:center;gap:10px;padding:8px 0;font-weight:400;margin:0}
.ck input{width:20px;height:20px;accent-color:var(--brand)}
.ok{display:inline-block;width:18px;height:18px;line-height:18px;text-align:center;border-radius:50%;background:#2e8b57;color:#fff;font-size:12px;font-weight:700;margin-left:4px}
#vt,.song b{text-transform:uppercase}
.sg{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:6px;cursor:pointer;font-weight:600}
.warn{border:1px solid #e0a526;border-radius:10px;padding:10px 12px;margin-top:10px;background:var(--surface)}
.trow a{color:var(--ink)}
.note{color:var(--mute);line-height:1.5;margin:6px 0 18px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:20;display:none;max-width:90%}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<header>
  <div class="top"><h1>Nyimbo</h1><button class="hb" id="menu">Backup &amp; install</button></div>
  <input id="q" type="search" placeholder="Search title, number or lyrics" aria-label="Search songs">
</header>
<div class="chips" id="chips"></div>
<main id="list"></main>
<button id="add">+ Add song</button>
<div id="toast" role="status"></div>

<div class="sheet" id="view">
  <div class="bar"><button id="back">Back</button><span class="sp"></span><button id="fav">☆</button><button id="sm">A-</button><button id="lg">A+</button><button id="ed">Edit</button>
    <button id="sc">Auto-scroll</button><input type="range" id="sp" min="1" max="6" value="2" aria-label="Scroll speed"></div>
  <div class="wrap"><h2 id="vt"></h2><p id="vc"></p><div id="vl"></div></div>
</div>

<div class="sheet" id="form">
  <div class="bar"><button id="cancel">Cancel</button></div>
  <div class="wrap">
    <label for="n">Song number (optional)</label><input class="f" id="n" inputmode="numeric" placeholder="e.g. 45">
    <label for="t">Song title</label><input class="f" id="t" autocomplete="off" style="text-transform:uppercase"><div id="sug"></div>
    <label>Song types (tick all that fit)</label><div id="cbox"></div>
    <input class="f" id="nc" placeholder="Or add a new type" style="margin-top:8px">
    <label for="l">Lyrics</label><textarea class="f" id="l" placeholder="Type or paste the lyrics here"></textarea><div id="lsug"></div>
    <div class="row"><button class="del" id="del">Delete</button><button class="pri" id="save">Save song</button></div>
  </div>
</div>

<div class="sheet" id="mn">
  <div class="bar"><button id="mback">Back</button></div>
  <div class="wrap">
    <p class="note" id="mode"></p>
    <div id="instbox"><h3 style="margin:0 0 6px">Install this app</h3><p class="note" id="insthelp"></p><button class="mb" id="inst" style="display:none">Install Nyimbo on this phone</button></div>
    <button class="mb" id="exp">Save a backup file</button>
    <button class="mb" id="imp">Restore from a backup file</button>
    <input type="file" id="file" accept=".json,application/json" style="display:none">
    <button class="mb" id="dups">Check for repeated lyrics</button><div id="dupres"></div>
    <h3 style="margin:26px 0 6px">Song types</h3>
    <div id="tlist"></div>
    <div class="row"><input class="f" id="ntype" placeholder="New type, e.g. Slow worship" style="flex:1"><button class="pri" id="addtype" style="flex:none;width:auto;padding:0 20px">Add</button></div>
  </div>
</div>

 ino ruia na mweri\n\n1.Hindi ino ruia na mweri, itiri na utheri\nAria maragia na tunua na ngoro-ini tiguo\nNikio gikeno kiagaga nyumba-ini ya Ngai\nNa ni wa njikire wega wanyonia mahoya\n\nNiwega niwega awa niwega makiria\nNi we waiyuriruo ni tha na ndugaruruke\nNikio undirikanaga makiriganiruo\nNa ni wanjikire wega, wanyonia mahoya\n\n2. Aingi moigaga ni agima namatiri agima\nNa ni mirimu ya ngoro irwaritwo ni aingi\nAngi moigaga matiri na iheo icio\nNiki waheirwo ni Ngai riria wetikirire\n\n3. Iguta ni ciikare thi ciarega kurima\nAria makenagia Ngai mukeniei riu\nMbura ihakuhi kura magetha maingihe\nIguta citigwo uguo cikue ni ngaragu\n\n4. Athuri metaguo itugi matire maundu\nAnake metaguo njamba niundu wa uhoti\nAiritu metaguo ikeno makenagie Ngai\nNa riria maikarite thi ng’aragu ni nene\n\n5. Aingi mariaga ohau thi-ini wa gikeno\nNa aingi manyuaga ohau thi-ini wa gikeno\nAingi makenaga ohau thi-ini wa gikeno\nNa riria maikarite thi ngaragu ni nene"},{"i":"b037","t":"HINDI YA MATHINA TIGAA BABA KURORA NA KUNGII","c":["Nyimbo cia Roho Mutheru"]},{"i":"b038","t":"JEHOVAH NI MUTHAMAKI JESU ETAGWO IGONGONA","c":["Nyimbo cia Roho Mutheru"]},{"i":"b039","t":"JESU MUTHARABAA WAKWA RIU NI NDEIGIRIRA HIKIRE MWATHANI WAKWA ONA AINGI MAGUTIGA","c":["Nyimbo cia Roho Mutheru"]},{"i":"b040","t":"JESU NI NGWENDETE WI KINDU GIAKWA","c":["Nyimbo cia Roho Mutheru"],"y":"Jesũ nĩ ngwendete wĩ kĩndũ gĩakwa\nŨhoro wa mehia nĩ waninĩire\nMũhonokia wakwa ũkĩhonokia\nNa rĩu nĩ ngũkwenda gũkĩra mbere\n\nJesũ wĩ mwendani Ngai\nGũtirĩ mwendani gũkĩra ũyũ\n\nNĩ wathecereirio mũtĩ igũrũ\nThakame ĩgĩitĩka matihio-inĩ\nNgũbia ya mĩigua nĩ wekĩrirwo\nNa rĩu nĩ ngũkwenda gũkĩra mbere\n\nNgoro ĩihũrĩtwo nĩ wendo mũingĩ\nTondũ nĩ wambire kũnyenda mbere\nŨgĩitũo thakame nĩ ũndũ wa kwenda\nNa rĩu nĩ ngũkwenda gũkĩra mbere\n\nIngĩtũũra muoyo o na kana ngue\nNo ndĩrĩkwendaga na ndigatiga\nGĩkuũ gĩgathira tũtigwo nawe\nNa rĩu nĩ ngũkwenda gũkĩra mbere\n\nTũkaaria na Jesũ twakinya igũrũ\nNa gĩkeno kĩingĩ gĩtagathira\nNgarutĩrwo thũmbĩ njĩkĩrwo mũtwe\nNa rĩu nĩ ngũkwenda gũkĩra mbere\n\nJesũ ngwendete wĩ kĩndũ gĩakwa\nŨhoro wa mehia nĩ waninĩire\nŨhonokio wakwa ũkĩhonokia\nNa rĩu nĩ ngũkwenda gũkĩra mbere"},{"i":"b041","t":"JOSHUA AKIRUGAMA AKIHITA , NII NA NYUMBA YAKWA YOTHE","c":["Akurinu praise","Nyimbo cia Roho Mutheru"],"l":"Kikuyu","y":"Joshua akirugama akihita\nAthuri na atumia na anake ; airitu na ciana iria nyinyi; aria othe murathii rugendo mwituei ta Joshua na andu ake\n\nJoshua akirugama akihita nii na nyumba yakwa yothe; turitungatagira Ngai; ona andu othe marega Ngai.\n\nRugendo ruru turaruthii; aingi matiri na tigiti ; na matiri na irio na mai; cia kumateithia rugendo-ini\n\nAmosi akiuga muthenya ucio; anake nginya airitu ao; makaringikaga ni nyota; magakuira njira ta nyamu\n\nAkani aiya indo iri kirumi; atumire anake moragwo; aria maari njamba cia Ngai; magikuira njira ta nyamu\n\nThakame ya mundu wa Ngai ndigaitika thi ta ya Nyamu; kana kiimba giake kihutio; ni nyamu kana mundu mwihia\n\nMwihitwa na kirikaniro ; nicio ngo na itimu mbara-ini no riria tugakinya iguru; ni thumbi na muoyo tukaheo"},{"i":"b042","t":"KAI JESU NI MWEGA ATWENDETEOO,OIMIRE IGURU AGIUKA GUKU THII","c":["Akurinu praise"],"l":"Kikuyu","y":"Kai Jesu Ni Mwega\nKaĩ Jesũ nĩ Mwega, Atwendete ũũ!\nNĩomire Igũrũ agĩũka gũũkũ,\nNĩathecirũo nĩ andũ na nĩaathĩĩnire,\nAkĩũragwo tondũ wa niĩ nawe.\n\nNa nĩendaga mũno tuoherũo Meehia;\nO ũrĩa werira akamũiyũkia,\nNa ndangĩte Mũndũ ũmwĩtĩkĩtie,\nNo amũteithagia O hingo ciothe.\n\nJesũ na arĩa akũũre me ndũgũ mũno;\nWe nĩamatoongagia ngoro-inĩ ciao;\nMũtaangĩri wao na Mũrĩithi nowe;\nO kĩrĩa maagaga We akamahe.\n\nIthuothe twĩtĩkie Jesũ O rĩu!\nAndũ araathime no andũ ake;\nNa rĩu tũrĩ muoyo no atwendaga,\nNa ningĩ twakua nĩagatũriũkia."},{"i":"b043","t":"KUMENYERERA WATHO WA NGAI","c":["Nyimbo cia Roho Mutheru"],"y":"Kũmenyerera watho wa Ngai\nNĩkuo kũmenyerera muoyo na ũũgĩ\nNa irĩkanĩro cia mwathani\nIria aarĩkanĩire na atheru\n\nTigai thiritũ na aremi\nMatu-inĩ ngerenwa ciao nĩ cia ruo\nNĩ maaregire kĩrathimo\nMwĩgunyĩ wao no kĩrumi\n\nWĩmenyerere ndũgakorwo\nNĩ kuuga ugaga ndeto na mĩromo\nNgoro-inĩ kũiyũire waganu\nJesu nĩ abatairio nĩ ũtheru\n\nWona waaga kwĩmenyerera\nRoho mũtheru ndarĩ rũmwe na irimũ\nNacio nĩ igatwarwo na kĩguũ\nNĩ ũndũ wa kwenda gwĩtongoria\n\nRatiri ya ma ya gwĩthima\nNĩ ngoro yaku wona waaga kwĩrigwo\nWĩthime ũmenye kana nĩguo\nRoho mũtheru agũtaarage\n\nRoho nĩ mũira wa ngoro iria\nCiendete mwathani na ma itarĩ nganja\nNa wĩtigĩri na wathĩki\nCiĩrĩgĩrĩire kĩrathimo\n\nMwathani nĩ akagaathĩrĩria\nArĩa meetereire mategũtheethũka\nNgoro ciyũire wĩhokeku\nNa ũkirĩrĩria wa mathĩna\n\nRoho mũtheru arĩkia wĩra\nNĩ agatongoria atheru nĩguo tũinũke\nMũciri mũũgĩ tũkamuona\nGĩtĩ-inĩ gĩake gĩa ũthamaki"},{"i":"b044","t":"MURU WANGAI AIGIRE ANDU ARIA","c":["Nyimbo cia Roho Mutheru"]},{"i":"b045","t":"MURUTHI WA JUDAH UKA NGORO","c":["Nyimbo cia Roho Mutheru"],"y":"Mũrũthi wa Judah, ũka ngoro;\nMũrũthi wa Judah, ũka ngoro yakwa;\nŨka ũndathime.\n\nNa woka nĩngũkena, ũka ngoro\nNa woka nĩngũkena, ũka ngoro yakwa\nŨka ũndathime.\n\nNa woka nĩngũgooca, ũka ngoro\nNa woka nĩngũgooca, ũka ngoro yakwa\nŨka ũndathime\n\nNa woka nũngũhona, ũka ngoro\nNa woka nĩngũhona, ũka ngoro yakwa\nŨka ũndathime\n\nNĩwe warĩ na Musa, ũka ngoro\nNĩwe warĩ na Musa, ũka ngoro yakwa\nŨka ũndathime.\n\nMũrũthi wa Judah, ũka ngoro\nMũrũthi wa Judah, ũka ngoro yakwa\nŨka ũndathime."},{"i":"b046","t":"MUTUNDA NI WAHANDIRUO NI MWATHANI BURURI URIA","c":["Nyimbo cia Roho Mutheru"]},{"i":"b047","t":"MWATHANI NA UTHERI WAKU WOTHE UNDONGORIE","c":["Nyimbo cia Roho Mutheru"],"y":"Mwathani na Ũtheri Waku Mwega ũndongorie\nKwĩ na nduma na niĩ ndĩ kũraya ũndongorie\nMwathani nyita makinya makwa\nIngĩenda kuona kũraya nyonia\n\nNdioĩ kana nĩ wega kũhoya ũhoro ũyũ\nNĩndendaga kwĩ menyera njĩra na ngethũkia\nNdendaga mĩago ya bũrũri-inĩ\nŨremi ũcio nĩũthũkĩtie ma\n\nRĩu Mwathani wakwa njohera macio mothe\nMĩaka ĩyo ya ũremi w Nĩma Ngai niĩ ndingĩtũũraga"},{"i":"b129","t":"NDIRORAGIRA IGURU HINDI IRIA KWINA NDUMA","c":["Fast worship"],"l":"Kikuyu","y":"Ndĩroragĩra igũrũ\nHĩndĩ ĩrĩa kwĩ na nduma\nNgoro yakwa ĩgakena\nNgoona riiri wa Ngai\n\nNĩ oigire kũgĩe nduma\nNa akiuga kũgĩe njata\nNĩguo rĩrĩa twaciona\nIkamũgoocithagia\n\nWee Ngai mwĩyoneri\nWee Ngai mwĩyoneri\nWoneire Iburahĩmu\nNdũrũme kĩhinga-inĩ\n\nRĩrĩa igũrũ kwĩ nduma\nNjata ikaihũra igũrũ\nAndũ othe makerorera\nWĩra waku Ngai\n\nNa ithuĩ nĩ tũgeragio\nNĩ getha wee woneke\nTwahootana thũ ĩkona\nWĩ mwena witũ Ngai\n\nWetire Iburahĩmu\nŨ'kĩmuonia njata igũrũ\nŨkĩmwĩra akaingĩha\nTa njata cia matu-inĩ\n\nGithĩ no niĩ mũnyũmbi\nWaragia ũhoro wakwa\nWatũmire ngaciarwo\nKwa mbarĩ ya Jakubu\n\nNjũkĩ no itũrathe\nNa icooke itũhe ũũkĩ\nMagerio marĩ ruo\nHĩndĩ ĩrĩa tũragerio\n\nTwagerio twahootana\nTũiguaga gĩkeno\nTũhenagia mene mene\nO ta thahabu\n\nNiĩ ngũtũũra gwaku\nWee Ngai mwĩyoneri\nNĩwe ũnyonagĩra\nKĩrĩa gĩothe ndĩ nakĩo\n\nO na kĩrĩa niĩ itarĩ\nNowe njetagĩrĩra\nWee Ngai mwĩyoneri\nNdũrĩ kĩndũ waagaga\n\nO na korwo kwa ngoma\nNo gũkunũke ithima\nNa gwaku kware mũno\nNiĩ gwaku ndikoima\n\nWee watũheire matũ\nBaba nĩ ũtũiguaga\nWee watũheire maitho\nBaba nowe ũtuonaga"},{"i":"b130","t":"NDURAGA NA THIRI ITOI NGARIHA ATIA,THIRI WA WENDO WA MUTHARABA","c":["Fast worship"],"l":"Kikuyu","y":"Ndũũraga na thiirĩ itoĩ ngarĩha atĩa\nThiirĩ wa wendo wa mũtharaba\nNdũũraga na thiirĩ itehota kũrĩha\nThiirĩ wa ũtugi ũyũ mũnene wa Ngai\n\nThiirĩ nĩ mũrata werutĩire agĩkua\nNĩgetha nduĩke mũgai wa muoyo\nNingĩ akĩrutĩra atwaranage naniĩ\nNgĩtuĩkania mĩkuru ĩrĩ nduma ya gĩkuũ\n\nIthenya rĩakwa rĩa gũkua akĩoya\nAkĩhe mweke wa gũtũũra muoyo\nŨhoti wakwa wa kwagana akĩeheria\nAkĩhe hinya nduĩke mwana wa Ngai\n\nNĩ kũndĩrĩra andĩrĩire wee\nAkĩndĩrĩra honoke\nNĩ kũndĩrĩra andĩrĩire wee\nAkĩndĩrĩra nduĩke mũthingu\nNĩ kũndĩrĩra andĩrĩire wee\nAkĩndĩrĩra ndũũre muoyo\n\nKorwo igongona rĩa ndegwa rĩarĩha\nI’ngĩmũthĩnjĩra ndegwa nyingĩ ma\nNjoke ndĩmũhe thahabu o na betha\nĨndĩ icio ciothe wee aranjĩra no ciake\n\nNĩkĩĩ ingĩmũhe nĩgetha a’kĩrĩhĩke\nThiirĩ wa wendo wa mũtharaba\nNĩkĩĩ ingĩruta nĩgetha njokie ngatho\nNĩ ũndũ wa ũtugi ũyũ waheire ũhonokio\n\nNĩkĩĩ ngũmũhe nĩgetha a’kĩrĩhĩke\nThiirĩ wa wendo wa mũtharaba\nNĩkĩĩ ngũruta nĩgetha njokie ngatho\nNĩ ũndũ wa ũtugi ũyũ waheire ũhonokio\n\nThiirĩ wa gũkuĩrwo ũngĩkĩrĩhwo nakĩ\nKuona ndĩnyihie ningĩ njathĩke\nNjoke njoe gĩkombe kĩa ũhonokio\nNduĩke wa gũthathaiya rĩtwa rĩake"},{"i":"b131","t":"AHOI NGOMA II NIRI MUKAMENYA INYUI NGOMA NDARI KINDU GIAKE GIA TUHU","c":["Fast worship"],"l":"Kikuyu","y":"Nderorera-ĩ thĩ ĩno arata akwa\nNĩ ndĩraigua kĩeha niĩ ningĩ ngarigwo\nRĩrĩa ndĩroona mũndũ ũmbĩtwo\nNĩ Jehova Ngai na mũhiano wake\nAhutatĩire mũmbi wake Ngai\nAgecagũrĩra athathaiye ngoma\n\nAhoi ngoma-ĩ\nNĩrĩ mũkamenya inyuĩ\nNgoma ndarĩ kĩndũ gĩake gĩa tũhũ\nAhoi ngoma-ĩ\nNĩrĩ mũkamenya inyuĩ\nThiri ciake ngoma iria amũhithaga\n\nThiri ciake\nNĩ akũheenie wee\nAgũthũkĩrie maica mũico akũũrage\nNgai wakwa-ĩ\nHonokia ahoi ngoma wee\nMaiguĩre tha baba wũi mahonokie\n\nHonokia mwathani\nTondũ nĩwe ũhonokanag\n\nArĩa matarĩ ciana\nNgoma aramaheenia\nMamũhoe amahe ciana\nKaĩ mũtangĩririkana\nNdungata ya Ngai Hannah\nNdangĩarĩ mwana\nAtũũria wĩtĩkio harĩ Ngai\nNĩ amũheire mwana\nWetagwo Samweli"},{"i":"b132","t":"KUHONOKANIA NIGUAKU WEE MWATHANI ,","c":["Fast worship"],"l":"Kikuyu","y":"Nyumbira Ngoro Lyrics – P Jey Kongo\n\nKuhonokania ni gwaku we mwathani\nNa wiriragiria mundu wothe akumenye\nAgutaukwo na amenye mithiire yaku\nNa unene waku na hinya waku Ngai\n\nNyumbira ngoro ya gugwitigira mwathani\nRiri ni ihoya ndahoya ndi mbere yaku\nNiguo hotage gwika maundu mothe\nKuringana na wendi waku mwathani\n\nItangiri na roho waku mutheru\nNdingihota gukumenya mwathi wakwa\nNdeithia kwinyihia na gutura ndi muthingu\nNiguo roho waku ature thiinie wakwa\n\nChorus x2\n\nNdaiya kwaga gwitigira maundu ma thi\nNo ngwitigire mwathani we munyumbi\nUndeithie nyumiririe kinya muthia\nMuturire uyu niguo ndikanaconoke"},{"i":"b133","t":"KWORUO MWAMENYA THINO NA MAUNDU MAYO","c":["Fast worship"],"l":"Kikuyu","y":"Korwo wamenya thi ino ati ndiri murata\nUngitigana nayo na maundu mayo\nUgie ndugu na Jesu ni murata wama\nOna moothe mathira we ndagagutiga\n\nMenyererai na mwimenyagirirei\nMaundu maria moka na mahananitio\nNa uhoro uria wa ma no ni makuhitithia\nNiguo ute kioneki na muoroto waku\n\nSamson athuritwo ni Ngai ari njamba\nAga kumenya akigia ndugu na Delilah\nAkurirwo maitho akiugaga no murata\nOna oraga thu ciake akuire atari maitho\n\nJakubu maturire hamwe na Esau\nNa mari nda ya nyina gukigia na haro\nEsau ndamenyaga niwe irigithathi\nAga kumenya akiendia urigithathi wake\n\nJesu oimire matuini agitiga uthamaki\nAgiuka guku thi ahonokie andu aake\nMaga kumumenya makimwamba muti ini\nNindamenya mwathani nianjiguiire tha\n\nRiria mbara ciangiha ona kwarituha\nUkona gutiri njira ungiurira\nRugama na wihande ucuthiririe Jesu\nUmenye ati ndwokire thi ino na mahitia\n\nAria mambire Jesu mutharaba iguru\nMoririo mekwenda uu makiuga Barnaba\nMatiamenyaga ati Jesu ni muthamaki\nMakiaga kumenya ati Barnaba ari muici"},{"i":"b134","t":"NGUGOCA NGAI NGORO IKENETE,MECIRIA MAKWA MEMATHERU","c":["Fast worship"],"l":"Kikuyu","y":"Ngũgooca Ngai ngoro ĩkenete\nMeciria makwa me matheru\nTondũ wee wiki wagĩrĩire\nJehova Ngai gũtirĩ tawe\n\nWee nowe wiki wagĩrĩire\nWee nowe wiki ngũinamĩrĩra\nWee nowe wiki\nMũnene wa ita\nNdakwambararia na ndakũgooca\n\nWombire thĩ ĩno na ũkĩũmba igũrũ\nNa indo ciothe tuonaga na maitho\nŨkĩhe mũndũ ũhoti wothe\nYa ũgĩ wothe akũgoocage\n\nRũrĩmĩ rwakwa rũriumbũraga\nŨhoro wa hinya na ũhoti waku\nWee ũrĩ igũrũ wa maũndũ mothe\nHinya na ũhoti nĩ ciaku baba"},{"i":"b135","t":"NI NGAKENA MUNO RIRIA NGOIMA TORO,NJUKIRE NYUME KIROTOINI GIA THINA","c":["Fast worship"],"l":"Kikuyu","y":"Nĩ ngakena mũno rĩrĩa ngauma toro\nNjũkĩre nyume kĩroto-inĩ gĩa thĩna\nNayo mĩrũri ya riũa rĩa kĩroko\nĨnjerekere ĩnguĩire ũtugi\n\nCioneki na iroto iria niĩ ndanarota\nNgai ũrĩa ũtũire muoyo acikinyanĩrie\nKuona nĩ ngaiga gĩconoko gĩkĩ thĩ\nNgai wakwa akinyanĩrie iroto ciakwa\n\nŨtukũ nĩguo nduma ĩtumanaga\nKĩeha na thĩna ikĩragĩrĩra ũtukũ\nNo riũa rĩara kĩroko gũgathera\nNgai wakwa nginyĩria kĩroko gĩakwa\n\nNĩ kũhoyagwo ũira ngaremwo gwĩtia\nMagĩkũgana niĩ ndĩkiragĩra o ki\nNĩ meciria Kũhũtha na mũtwe wakwa\nNdaarĩkia ũira ngũcooka ndore nakũ\n\nMathiĩ kũhotha ndĩkũnjaga nĩ heho\nNa mwathi wakwa ti kuuga nĩ ũthũire\nNĩ mũũthĩ wakwa ũtarĩ ũrakinyĩrĩra\nNdagũthaitha tu njokeria mũthenya ũcio\n\nNĩ nyonaga makĩrĩa na makĩĩhumba\nNa ndiigue ũiru ngerirĩria ũhoro ũcio\nNgoro-inĩ yakwa tondũ ndĩ mũgũthaithi\nNgamenya kũna nĩwe ũmatugĩte ũguo\n\nMĩtugĩre yaku tondũ nĩ ya mwanya\nNa wĩtagwo mũheani ũtanogaga\nNgũnjũrĩra, ndambũrũkĩria mũnyaka\nNyone wega itarĩ ndathiĩ mbĩrĩra-inĩ\n\nNĩwe wanyũmbire na ũkĩnjiga gũkũ\nThĩ ĩno ya thĩna ningĩ ya mĩnyamaro\nThĩ ĩno ndũire hĩtũkanaga na gĩkuũ\nO ngĩethera mwĩrĩ ũyũ tondũ wĩ kwao\n\nNa tondũ wee nĩ ũkinyanagĩria ũtugi\nInamia gũtũ gwaku ũigue makaya\nNĩ ndĩrirĩirie mũno gũcanjamũka\nNgai wakwa njarĩria riũa rĩa wega\n\nNĩ ngũkũhoya ndũũre itarĩ mũrimũ\nNĩ ngũkũhoya ndĩtũũrĩre na thayũ\nIngĩrĩa ũũru na ũkorwo wĩ ngoro-inĩ\nNa ndarĩa wega ndĩ nawe ũrogoocagwo\n\nNĩ ngũgũthaitha Ngai ndũkanandige\nTũũra tu ũmenyagĩrĩra ngoro yakwa\nŨngĩkoona ũũru mbere ũkaahithaga\nNgĩrooka gwaku ngarookaga ndĩ thayũ"},{"i":"b136","t":"NI RUCINI RWEGA DADDY NI WANJARAHURA","c":["Fast worship"],"l":"Kikuyu","y":"Nĩ rũcii-inĩ rwega Daddy nĩ wanjũkĩria\nAmũkĩra ũgooci tondũ nowe ũndairie\nReke ũndũ ũyũ ũtuĩke ũndũire na mũtugo wakwa\nWa gũkũmenyithagia mĩbango yakwa rũcii-inĩ\nTondũ ndĩ nawe nĩnjũĩ no kũrĩtuka thayũ\nNdĩ nawe Jesũ nĩnjũĩ no kũrĩtuka thayũ\n\nNdingĩhota kwambia mũthenya ũyũ itarĩ nawe\nO na ndikwenda kumagara tũtarĩ nawe\nKwahota ndiũĩ mũthenya ũyũ ũrĩtukĩra ha\nNo ndĩ nawe nĩnjũĩ no kũrĩtuka thayũ\nKwahota ndiũĩ mũthenya ũyũ ũrĩtukĩra ha\nNo ndĩ nawe nĩnjũĩ no kũrĩtuka thayu\n\nRathima riumagarĩro na ihũndũkĩro rĩakwa\nNdĩ bara-inĩ iria nene o na tococoro-inĩ\nNdĩ mĩhang'o-inĩ yakwa ndahoya ũheage gũtaũkwo\nNdikanaume na thayũ njoke nyinũke ngĩcayaga\nTondũ ndĩ nawe nĩnjũĩ ndĩ mwena wa ũhootani\nNdĩ nawe Jesũ nĩnjũĩ ndĩ mwena wa ũhootani\n\nNgitagĩra na andũ a wendi mũũru o na atunyani\nRũruka rwa andũ a ũiru na andũ arĩa matarĩ thithi\nMĩbango yao igũrũ rĩakwa ndĩkanagaacĩre\nNjĩra ciao itumane o na cigĩe ũtenderũ\nTondũ ndĩ nawe nĩnjũĩ ndĩ mwena wa ũhootani\nNdĩ nawe Jesũ nĩnjũĩ ndĩ mwena wa ũhootani"},{"i":"b137","t":"NINJUI MUNGURI ATURAGA MUOYO MUHEI NGORO INO YAKWA THAYU","c":["Fast worship"],"l":"Kikuyu","y":"Nĩnjũĩ mũngũũri atũũraga o muoyo\nMũhei ngoro ĩno yakwa thayũ\nŨcio ũtũũraga mĩndĩ na mĩndĩ\nMũndori na ningĩ mũnderi\n\nRĩrĩa thũ ciakwa ciokĩte ciniine\nCiehĩtaga atĩ cikũndĩa ndĩ muoyo\nNo tondũ mũngũũri atũũraga muoyo\nAarahũkire ciothe ikĩhurunjũka\n\nAndũ amwe me itua nda ta Babyloni\nNĩ moonire ũhoti wa Ngai witũ\nRĩrĩa Ngai aatũhũndũrĩire njĩra\nTũnua tuitũ aatũiyũririe mĩtheko\n\nKũu kũũmũ kũndũ rũng'ũrĩ-inĩ\nAatũheire maaĩ na agĩtũhe irio\nMũhũũnia wa nyoni cia rĩera-inĩ\nNĩ atuĩkĩte rĩakĩro riitũ\n\nAyubu agerio mwĩrĩ na indo\nThutha-inĩ Ngai akĩmũcookeria ciothe\nOigire rĩu nĩ ndamenya wega\nMũbango wa Ngai ndũngĩgirĩrĩka"},{"i":"b138","t":"NYIITAGIRIRA,NYIITAGIRIRA,NYIITAGIRIRA MWATHANI WAKWA","c":["Fast worship"],"l":"Kikuyu","y":"Nyitagĩrĩra, nyitagĩrĩra, nyitagĩrĩra\nMwathani wakwa\nNiĩ ndingĩtooria, niĩ ndingĩtooria\nNiĩ ndingĩtooria itarĩ nawe\n\nThũ cianathekerera\nIkoiga ndingĩtooria\nNowe mwathani wakwa\nWanandũĩrĩra\n\nGuoko gwaku baba\nKũrĩ igũrũ rĩakwa\nNiĩ ndĩ makĩria\nMa atooria\n\nMĩbango wĩ nayo mĩega\nIgũrũ wakwa\nNĩ ũnjĩciiragia\nMeciria mega\n\nIrathimo ciaku\nNĩ ndĩciĩgwatĩire\nNĩkĩo mwathani wakwa\nNdĩrakwambararia\n\nKiugo gĩaku Ngai\nNĩ kĩnjĩĩraga\nNgũkayagĩre\nNa nĩ ũrĩnyonagia\n\nMaũndũ manene\nMatarĩ monwo\nKana gũthugundwo\nNĩ meciria ma mũndũ"},{"i":"b139","t":"THA CIA NGAI CIANIKITUO MUTHARABA-INI","c":["Fast worship"],"l":"Kikuyu","y":"Tha cia Ngai cianĩkĩtwo mũtharaba-inĩ\nŨrĩa ũtũũraga Golgotha andũ ake moone\nMũgambo wake naguo rĩu nĩ ũkwanĩrĩra\nŨkeraga andũ ake macoke kũrĩ we\n\nŨrĩa ũregete kũhonoka ũcio nĩ kwĩmena\nNake ũrĩa ũregete ũthingu akenyarara\nŨrĩa wendaga muoyo wake nĩ aũhithaga\nAũhonokie mĩtino ya muoyo ũyũ\n\nNĩ kũrega andũ maregete njĩra ciake\nNa makamwagĩra handũ ngoro-inĩ ciao\nMakenagĩra o kũgwetaga rĩtwa rĩake\nMatekwenda kũhingia mathani make\n\nNũũ ũcio mũũgĩ ũngĩtiga irio metha-inĩ\nAhang'ĩre nda yake kĩara takataka-inĩ\nNĩguo andũ akwa mekĩte makandirika\nMakerehere mĩtino o na gĩkuũ\n\nO na itakũĩ ngũgũtua mũrata wakwa\nNgũhithũrĩrie hitho ĩno ĩna mũnyaka\nŨtonga ũrĩa ũtabuthaga nĩ ũrakinyĩrio\nArĩa othe marerira makahehenjeka"},{"i":"b140","t":"NI NYONETE WIHITHO MURUMUUU","c":["Soft praise","Fast worship"]},{"i":"b141","t":"ARIA MAMENYANITE NA MWATHANI WAO MATIKAGA MAUNDU","c":["Soft praise"]},{"i":"b142","t":"MAWIKO MAKU MWATHANI NIMAKUGEGANIA","c":["Soft praise"]},{"i":"b143","t":"JEHOVA NIATUGAGIRIA ANDU ARIA MENYIHAGIA","c":["Soft praise"]},{"i":"b144","t":"NGAI WI MUNENE NIMA WI MUNENE","c":["Worship"]},{"i":"b145","t":"MUTHENYA WAKWA WA KINYA NA NDINAMA NI UGAKINYA","c":["Worship"]},{"i":"b146","t":"NDUKAREKE BABA TUTHERERE","c":["Worship"]},{"i":"b147","t":"E GUKU EGUKU EGUKU MWENR HINYA EGUKU","c":["Worship"]},{"i":"b148","t":"JEHOVAH NDAKWAMBARARIA","c":["Worship"]},{"i":"b149","t":"INII WI NGAI MUNENE MAH NA GUTIRI NGAI UNGI TAWE","c":["Worship"]},{"i":"b150","t":"MAWIKO MA MWATHANI NI MAKUGEGANIA","c":["Worship"]},{"i":"b151","t":"JEHOVAH KIHOTI WA MOTHEE UNENENE WAKUU","c":["Worship"]},{"i":"b153","t":"WI NGAI MAHINDA MOTHE","c":["Worship"]},{"i":"b154","t":"IGIAKURE NGORO TENE .....NGORO YAKWA IGANENA NIKUMENYA","c":["Worship"]},{"i":"b155","t":"THA CIAKU ITIRI MIHAKA KUONA UMUTHI TURI O MWOYO","c":["Worship"]},{"i":"b156","t":"NJAURA ICOKI RIRIRI","c":["Worship"]},{"i":"b158","t":"WE NIWE NGAI WIKA nThũ ciokaga ngathithina\nGithĩ watharĩte o tene"},{"i":"b174","t":"WI MUTHAKA MUNO MWENDWA WAKWA","c":["Worship"]},{"i":"b175","t":"JESU NJIKARIA MUTIINI GITHIMAINI KIA UTUGI","c":["Worship"]},{"i":"b176","t":"RIRIA WA NYONIRIE KUHOYA","c":["Worship"]},{"i":"b177","t":"WITAGWO NGAI NGAI NGAI NGAI NGAI WITAGWO NGAI NGAI NGAI NGAI NGAI","c":["Worship"]},{"i":"b178","t":"WE NI MUHINGIA WA IRIKANIRO ETAGWO KUUGA NA GWIKA","c":["Worship"]},{"i":"b179","t":"NIWEGA MWATHANI TONDU WE NDUCENJAGIA ARATA MACENJIA WE NGAI NDUCENJAGIA","c":["Worship"]},{"i":"b180","t":"NDIGATIGA KUUGA URI MWEGA MARIA MOTHE UNJIKIIRE BABA NDIKARIGANIRWO ONARII","c":["Worship"]},{"i":"b181","t":"NDARI KIRIMAINI KUNDU MIKURUINI MATHINA MAINGI ONA MAITHORI","c":["Worship"]},{"i":"b182","t":"BABA HE KAHINDA RINGI NA UNDWE TA TUNGATATA YAKU","c":["Worship"]},{"i":"b183","t":"AKORWO NIWE BABA NJIRA NJUKE,AKORWO NIWE BABA NJIRA NJUKE","c":["Fast worship"],"y":"Ndĩratũire karia-inĩ hoyaga\nMũndũ ũngĩnyita guoko anyambararie\nMũraika akiunjuga maaĩ andikie kuo\nNĩguo thĩna ũyũ wakwa ũthire\n\nAkorwo nĩwe baba njĩĩra njũke\nAkorwo nĩwe baba nyita guoko\nŨnyambararie igũrũ rĩa mũiyũro ũyũ\nO na niĩ ngere igũrũ rĩa maaĩ\n\nŨteithio wakwa uumaga kũrĩ wee\nO wee mũmenyereri, mũngitĩri\nNdoiga ndikwĩhoka mũndũ wa thĩ rĩngĩ\nTondũ mwĩhoki mũndũ nĩ mũrume\n\nNĩ ndakũhoya baba ũngitĩre\nNdikanamerio nĩ mũihũro ũyũ\nNĩguo arĩa othe makwĩhoka tondũ wakwa\nNĩ ndakũhoya matikahootwo\n\nMwathani ũtuĩkĩte hinya wakwa\nNa ũgatuĩka ũgitĩri wakwa\nThũ cianjũkĩrĩra miguĩ ũkoinanga\nTondũ anyenderi ũũru no aingĩ"},{"i":"b184","t":"AKIHUNJIA NA AKIMERA MERIRE,AINGI MARI BUSY MAGITARA MBIA","c":["Fast worship"],"y":"Akĩhunjia na akĩmera merire\nAngĩ maarĩ busy magĩtara mbia\nMaathogoranaga maitho-inĩ make\nMatiaiguaga thoni\n\nA'kĩmeera mena haaro kũna\nNĩ amu matiracarania na muoyo\nMateng'eranĩtie gũĩtwo rĩtwa\nItonga, itonga, itonga\n\nCiugo, ciugo ici\nNĩcio ciarehire maũndũ me bata\nAkĩmarĩria we nĩ augaga\nOkire amateit atigari\nŨcio mũrori wa ngoro yaku\nAgakũrĩhĩra thiirĩ wothe\n\nKĩeha na gĩkuũ agacitunya ũhoti\nAgagũcenjanĩria na muoyo\nŨcio mũkũrangĩri ngoro yakwa\nNdacũngaga kana ahĩtwo nĩ toro\n\nMũrũthi wa Juda\nGũtirĩ ũndũ ũkũremaga\nMũrũrũĩrĩri ngoro yakwa\nNĩma, nĩma ũrĩ kĩriga ah ah\nHalleluyah, Halleluyah, Halleluyah"},{"i":"b246","t":"NI NGUKUINIRA RUIMBO BABA ABBA UKINJIGUE,","c":["Slow worship"],"y":"Nĩngũkũinĩra rũĩmbo Baba,\nAbba ũkĩnjigue;\nRuumĩte mũthithũ wa ngoro thĩinĩ,\nNdirĩ kĩndũ kĩngĩ kĩega gĩa gũkũrehera;\nAmũkĩra igongona rĩa ngoro yakwa.\nNdatũraga ndumainĩ ũkĩnyonekera,\nŨkĩ rehe ũtheri ngoro yakwa thĩinĩ:\nNaniĩ rĩũ nĩ ngũkenera ũtheri ũcio waku,\nAmũkĩra igongona rĩa ngoro yakwa.\n\nWaringithanirie mwana,\nWaku Wendete mũno,\nNa ndũrũme ya igongona niĩ honoke:\nAkĩnguĩra mehia makwa, ruuo na mĩnyamaro,\nNo nĩ mweke mũciĩ ucio wa igũrũ.\nO na mũciari wakwa ndangĩetĩkĩrire;\nKũndutĩra muoyo wa mwana ũngĩ,\nWendo waku nĩ mũnene, ndũmenyeka ũrĩa ũtariĩ,\nAmũkĩra igongona rĩa ngoro yakwa.\n\nNĩ ngũnyarara ũtonga na indo cia gũthira,\nTondũ rĩrĩa mehia mahatĩrĩirie,\nNda caririe ũteithio indoinĩ na ndia teithĩkire;\nNdakaĩra Baba akĩnyamarũra.\nNgũria muoyo wa mũndũ, ũngĩkĩgũrũo nakĩ?\nKuona atĩ indo ciothe ciathĩ itingĩigana;\nMbeca igũraga o indo, iria nyandĩke thogora,\nNgũria muoyo ũngiuma mbeca cigana.\n\nHihi ndakinya gwaku, na wanyamũkĩra,\nNĩ ũkahe ngarama ya ũhonokio wakwa?\nAca ndũkandarĩra marĩa ndũmĩte wĩke,\nTondũ ndũranyenderia ũhonokio.\nAngĩ maheete thirĩ, nĩ mandokagĩra,\nNo nĩngũkena atĩ ndũnandũraga;\nNanguona no wega tondũ, ingĩgĩkũrĩha nakĩ?\nAmũkĩra igongona rĩa ngoro yakwa.\n\nKuona atĩ ndũngĩ hakwo,na indo cia gũthira;\nNa ndũngĩ henio nĩ mũndũ ũrĩ ũmbĩta;\nKĩhe ũthingu wa ngoro, ndi karegwo nĩ wee,\nNgwĩrirĩria gũgatũrania nawe.\nWe Mwega na Mũthingu, Ndakũina mĩrĩra,\nNĩ tondũ wa wĩrutanĩria waku,\nO na wĩrutĩri waku, nĩguo ngahonoka;\nAmũkĩra igongona rĩa ngoro yakwa.\nO na wĩrutĩri waku, nĩguo ngahonoka;\nAmũkĩra igongona rĩa n a guoko baba ndĩkie rũgendo\n\nNdanatihangio na gũcambio mũno\nNginya ngoro yakwa ĩkagĩa na ironda\nNĩ arĩa tũthiaga thiriti nao\nMoona ngĩrathimwo makaigua ũiru\n\nNdakũhoya baba ũnjehererie\nGĩkombe kĩa mathĩna rũgendo-inĩ\nNamo maithori marĩa ndanarĩra\nŨmagarũre matuĩke gĩkeno\n\nMatukũ mĩrongo ĩna me hakuhĩ\nGũthira tũtige kũnyarirĩka\nŨrĩa ũtuaga ciira na kĩhooto\nE mwena witũ tũtirĩ a kũhootwo"},{"i":"b284","t":"GITHIMA","c":["Praise"],"l":"Kikuyu","y":"Nĩ kwarĩ mũndũ ũmwe wetagwo Isaaka-ĩ\nMwana wa Iburahĩmu ithe wa wĩtĩkio\nA'gĩthiĩ gũtũũra bũrũri wa Gerari-ĩ\nBũrũri wao wagũmĩrwo nĩ ng'aragu\n\nThũ cia kĩrathimo citikĩrĩ ciaga-ĩ\nMakĩona Isaaka ũrĩa atheeremire\nMũthamaki agĩathana Isaaka aingatwo-ĩ\nNdakaĩ gũtheeremera bũrũri wao\n\nNdenjire Hezeku inyuĩ mũgĩthika-ĩ\nNgĩenja Zitina o na kĩo mũgĩthika\nGĩkĩ ndenja kĩretwo Rehobothu-ĩ\nNĩho ngũtheeremera mũtiĩgĩthika\nGĩkĩ ndenja kĩreetwo Rehobothu-ĩ\nNĩho ngũtheeremera mũtiĩgĩthika\n\nIsaaka agĩthikũria ithima cia ithe-ĩ\nIria ciathikĩtwo nĩ Afilisti\nAthikũria kĩa mbere gĩgĩthikwo-ĩ\nAthikũria gĩa keerĩ gĩgĩkwo oro ũguo\nAkĩenja kĩngĩ na moko make mwene-ĩ\nNa agĩgĩtua rĩtwa Rehobothu\n\nNiĩ ndooka kwarĩria ciana cia wĩtĩkio-ĩ\nIria ciĩhokeete Ngai wa Isaaka\nŨyũ ũtũmaga mũndũ ahande na agethe-ĩ\nNginya hĩndĩ ĩrĩa riũa rĩakanĩĩte mũno\nAgathereria rũũĩ rwa wega wake-ĩ\nRũtherere rũkũrie kĩrĩa kĩhande\n\nWahingũrire wĩra wa mbere ũkĩhinga-ĩ\nŨcio wĩra ngũũhaanania na Hezeku\nŨkĩhingũra wa keerĩ naguo ũgĩthira-ĩ\nO na ũcio ngũũhaanania na Zitina\nŨndũ ũrĩa ũkũgeria rĩu nĩ ũgũtheerema-ĩ\nRehobothu nĩrĩo igai riitũ ithuĩ athingu\n\nIthuĩ ahande gĩtina-inĩ kĩa ũthingu-ĩ\nTũtigakaragacũka o ta thĩ nyũmũ\nNa tũtikahaana rũũĩ rũrĩa ruonaga-ĩ\nRiũa no rũgakĩrika kũhũa naihenya\nTũkũhaana gĩthima kĩrĩa gĩtangĩhũa-ĩ\nO na riũa rĩngĩakana atĩa gĩtingĩhũa"},{"i":"b285","t":"GOOCAI MWATHANI WA ATHERU RIU TUMITE IRIA IRIKU","c":["Praise"],"l":"Kikuyu","y":"Goocai Mwathani wa atheru,\nRĩu tuumĩte iria iriku,\nRũgendo rũkirie gũthira,\nTwambate na mwĩrĩ wa Roho.\n\nGoocai Ngai witũ goocai,\nGoocai Mwathani wa atheru,\nMathĩna mathiĩte gũthira,\nTwambate na mwĩrĩ wa Roho.\n\nMwathani nĩatũhonokirie,\nNdundu cia aremi na akararia,\nMarakara matanakinya,\nTweherie ngarari na ũremi.\n\nNgiri na ngiri cia ũhonokio,\nCiikaire gĩtĩ-inĩ kĩa ũnene,\nCietereire tuume mbaara-inĩ,\nTwambate na mwĩrĩ wa Roho.\n\nRoho Mũtheru nĩ aratwĩra,\nTũiyũrwo nĩ gũkirĩrĩria,\nMwathani witũ ahootanire,\nNa wendo na gũkirĩrĩria.\n\nTũikarage na ngoro theru,\nTũrĩ wĩra-inĩ wa Mwathani,\nKũrĩ thĩĩna kana gĩkeno,\nRĩtwa rĩake no rĩgoocagwo."},{"i":"b286","t":"GUCA NGAI NII NJITIKITIE NI NGAKUIONERA NA MAITHO MAKWA ,NDI BURURI WA ARIA MARII MUOYO","c":["Praise"],"l":"Kikuyu","y":"Guca Ngai niĩ njĩtĩkĩtie-ĩ\nNĩ ngakwĩyonera na maitho makwa\nNdĩ bũrũri wa arĩa me muoyo-ĩ\nNgoro yakwa ĩngĩrĩ kũhoteka\nNo nĩ ngũkũgooca na ngũtũgĩrie-ĩ\nWee Jehovah rũirigo rwakwa-ĩ\nMũrũi mbara yakwa ona itarĩ ho-ĩ\nMũndeteri ũtendaga ihaki\n\nNgai, Ngai\nNgai wa Ngai, Ngai wakwa-ĩ\nMwĩhoko na kĩrĩgĩrĩro-ĩ\nGĩthima kĩa ma na kĩa muoyo-ĩ\nTũũra ũnyotorete ngoro ĩno\n\nNdĩ ũndũ ũmwe nyendete harĩ we-ĩ\nNa nĩguo niĩ ndĩthingataga\nNa nĩ atĩ njikare nyũmba-inĩ yaku-ĩ\nMatukũ mothe ma muoyo wakwa\nNdĩtũũrĩre o hema-inĩ yaku-ĩ\nNgenagĩre irathimo ciaku-ĩ\nIria itaumagwo thuutha nĩ kĩeha-ĩ\nNyinage rwĩmbo rwaku ngakena\n\nOna mangiuga atĩ gũtirĩ-ĩ\nNĩnjũĩ wīkuo na wĩ muoyo\nWee ũtũmaga gũkĩe na gũtuke-ĩ\nŨgatũma kware na kuure mbura\nMũhei rũũtha riũa rĩrathe-ĩ\nMũtemi njĩra kũrĩa gũtarĩ-ĩ\nMũhatũri wa arĩa othe ahatu-ĩ\nNgai mwene hinya na ũhoti\n\nIngĩmenya kĩrĩa kĩngĩtũma-ĩ\nNiĩ na we Ngai tũtigane\nNiĩ Ngai no ndĩgĩtigire-ĩ\nOna ndĩkĩendete ndĩkĩrekie\nNjũre ihenya ngĩũrĩra mehia-ĩ\nNa we ũhe ngoro yakwa hinya-ĩ\nNdĩtiirie magerio ma thĩ ĩno-ĩ\nNdingĩenda kũigua no njage muoyo\n\nNgai wakwa-ĩ\nMwĩhoko na kĩrĩgĩrĩro nowe\nGĩthima kĩa muoyo\nNa gĩthima kĩa ma\nTũrania na niĩ Ngai\nNdũkanareke njonoke Ngai\nWe nĩwe gĩthima kĩa ma\nGĩthima kĩa muoyo, Ngai\n\nHaiya, Ngai-ĩ\nTũrania na ngoro yakwa, Ngai\nGĩthima kĩa ma, na kĩa muoyo\nKĩrĩgĩrĩro nowe"},{"i":"b287","t":"GUKU NDURAGA NJETAGIRIRA MWATHANI MURIITHI MWEGA JESU URIA WAHONOKIRIE","c":["Praise"],"l":"Kikuyu","y":"Guku nduraga,\nnjetagirira mwathani\nMureithi mwega,\nJesu uria wahonokirie\n\nNa riria agoka,\nningamutunga rieraini.\nNa riria agoka\nningamutunga rieraini.\n\nAkoima matuini,ena uthamaki na riri\n\nAtongoretio ni mbutu nene ya araika.\n\nAgoka niguo, ahingirie irikaniro.\n\nOna mihitwa, yothe iria twarikaniire.\n\nHindi iyo niguo, ngoro yakwa ikahorera.\n\nNamo maithori, makagirio muthenya ucio.\n\nRiu ndimwonaga, na mairia eharaya agiuka.\n\nNa muthenya ucio, ngamuona na ndimugeithie\n\nNiakanjariria, na ciugo njega cia wendo.\n\nAnjire huruka, we mwana wakwa nyenda.\n\nNingatwikania, gatagatiini ka araika.\n\nThii he mwathani, Jesu uria wahonokiri"},{"i":"b288","t":"GUTIRI NJIRA NGAI UTANGIGERA, UGIUKA KUGERIA URIA MWIKOHOKI","c":["Praise"],"l":"Kikuyu","y":"Gutiri njira Ngai utangigera,\nUgiuka kugegia uria mukwihoki,\nRuo-ini na gikeno-ini no uke,\nGucerera ngoro iria withuriire.\n\nGithi ndwatumire Ihuru rihunie,\nElijah Samaria kwi ng’aragu,\nNa karui ka hua wamwirire athii,\nSidoni kwa mutumia wa ndigwa\n\nAisraeli monete muthiro,\nMakuhiriria Iria riria itune,\nNikiriga wanyitiriire mai,\nMwena uyu no uyu,\nMakiringa othe.\n\nKurera gwa ithenwa iguru ria mai,\nNgombo ndikanaimwo ithenwa hindi ingi,\nNdungīgiria Lebanoni eheane miti,\nNyumba ciitu itikoinwo Thimo.\n\nWoigire Jakubu niwamwendire,\nEsau ukimuthura enda ya nyina,\nWirathimagira mundu uria wenda,\nNawarathima gutiri ungiruma.\n\nWoka kwambararia nduroranagia,\nMundu acirirwo kuu na acirirwo nuu,\nArerirwo atia, Athomete nginya ku,\nIhinda riaku rioka ndungitira"},{"i":"b289","t":"HABBAKUH RIMWE ATHOMIRE UHORO WAKU,UKIMUNENEHERA NGINYA AKIGEGA","c":["Praise"],"l":"Kikuyu","y":"Habakuku rimwe athomire uhoro waku\nUkimunenehera muno akigega\nAkiririria maundu macio wekaga\nHindi-io ya tene mekike muoyoini uyu\n\nMaria wekaga Ngai ona umuthi nowike\nCioneki citu ngai githi touhingie\nTukenere utugi waku twi muoyoini uyu\nNi amu ngai onariu nduremetwo gwika\nTukenere utugi waku twi muoyoini uyu\nNi amu ngai onariu nduremetwo gwika\nTukenere utugi waku twi muoyoini uyu\nNi amu ngai onariu nduremetwo gwika\n\nWaringaringiire hannah kiroko kimwe\nMutumia uterigiriire no ongithie\nUgitiga weka kaundu ndaiini yake\nNdina mwihoko ona umuthi uyu nowike uguo\n\nWaririirie jehoshabatu ari mbaraini\nThuu ikinyite handu ikenda kumuguoyohia\nNgai wee ukigoocithia withiinie wa rwimbo\nNdina mwihoko ona umuthi uyu nowike uguo\n\nNiwaho riria jorodani yaihuire\nNaniwedaga isirairi mahetuke\nUria wekire hindi iyo joshua ni muira\nNdina mwihoko ona umuthi uyu nowike uguo\n\nWee wonagia moko maitu kurua mbara\nNokauga twaringaringa niukuhingura\nNariria twamatha utuiraga ni tukuona\nTuhingirie macio ngoro citu igikene\n\nTigaga gukiraga hindi ya mathina\nNdukahithe uthio waku riria tugugwetha\nNa tondu nijui wee nduihithite muno\nWiguurie tu ngai ta hindi iyo ya tene"},{"i":"b290","t":"HINDI IMWE JAKUBUU NIA ANYITIRUO NI KIEHA KIEHA KINENE NGINYA AGITHII AGIKOMA","c":["Praise"],"l":"Kikuyu","y":"Hĩndĩ ĩmwe Jakubu nĩ anyitirwo nĩ kĩeha\nKĩeha kĩnene nginya agĩthiĩ agĩkoma\nNgai agĩtũma mũraika akamũhorerie\nAmu ngoro ya Jakubu nĩ yakĩinamĩte\n\nIcoki na matamu ihoreragia mbarathi\nNaguo ũtana wa Ngai ũhoreragia ngoro\nĨrĩa yũrĩtwo nĩ hinya na ĩgathuthĩka\nNgai horeria ngoro ici ciũrĩtwo nĩ hinya\n\nMũraika hĩndĩ ĩrĩa akinyire harĩ Jakubu\nAkĩũria Jakubu nĩkĩĩ gĩatũma ũkome\nKaĩ ũriganĩirwo nĩ Ngai ũrĩa ũgũteithagia\nRora matu-inĩ wone nĩ ũtũmĩirwo ũteithio\n\nLabani na ariũ ake makĩharũkwo nĩ ũiru\nMona Jakubu handũ athire no gũtherema\nJakubu ona ũguo agĩthama kwa Labani\nAgicooka Kanaani kwao kũrĩa aciarĩirwo\n\nKwĩ na andũ maraigua ũiru nĩ irathimo ciaku\nMona ũrĩa ũtheremire marakang'wo nĩ ngoro\nMagathondeka thiki ndũrũ makũhe ũhuke\nNgai akamĩkĩra mũcamo ĩgakũnyotora\n\nNgai wa Jakubu mũgitĩri wa irathimo\nNĩ eharĩirie gwĩka ũndũ mwerũ ũtũũro-inĩ waku\nMwĩhoke na ũmweterere na ũmwĩrĩgĩrĩre\nAgũcenjerie ũtũũro wĩtagwo mũrathime"},{"i":"b291","t":"HINDI IRIA DAUDI ARIKIRIE GUKIURAGA NGORIATHU II, MATHINA MAKIANJIA KUMUMIRIRA NA MIENA YOTHE","c":["Praise"],"l":"Kikuyu","y":"Hindi iria daudi arikirie gukiuraga Goriathuu ii,\nMathina makianji kumumirira na mwiena yothe,\nAndu Aria ehokete oothe makimutuikira thu ii,\nOna saulo amuikagiria itimu  niguo amuninee.\n\nMaguta Mari thima marikia guitiririo mundu ii,\nMatumire daudi  onio thina muingi ni saulo ii,\nNaithui no matuonetie thina magatugushiriria thuu,\nNo undu njui no ati Ngai niamatuagirira.\n\nDaudi eciragia ni agashira uthamakini wake ii,\nGithi nama kiari kiambiriria Kia mathina make,\nAgarurukiruo ni maundu nginya ciana ciake ii,\nMuriu wake akomire na atumia aake kwi muthenyaa.\n\nHindi iria Daudi ainiirwo ati nioragite makiri ii,\nHindi iyo noguo ngoma cia Saulu ciarahukire\nAmuteng’eragia irimaini ngiyangia ngurunga-ini ii,\nNa rimwe akamubangagira mbara itari gitumia.\n\nRiria ndeciririe nindagacira mauni wakwa ii\nNgoma akiruma kini ndahurukagia ni mahenya\nNdiamenyaga maguta ma maini nomatume ndire ii\nNdithikire ni kieha maguta mari mbara nyingi\n\nJehova arahuka wariririe maguta maaku ii\nOna ithui amakui Ngai ugitumenyerere\nKuona ati nama tuturaga tutegeirwo mitego ii\nMundu wothe uri maguta ti itheru turi thina ini"},{"i":"b292","t":"HINDI IRIA MUIGAI ARI MUOYO,MWIGAIRUO NDARI NA RUTHA","c":["Praise"],"l":"Kikuyu","y":"Hĩndĩ ĩrĩa mwĩgai arĩ muoyo\nMwĩgaĩrũo ndarĩ na rũũtha\nRwa kũhuutia kĩndũ o na kĩmwe\nKĩa mũmwĩgaĩri arĩ muoyo\n\nNĩ ndĩgaĩirwo nĩ mwathani\nGĩkuũ gĩake mũtharaba-inĩ\nNĩkĩo kĩandeheire gĩkeno\nNgĩkĩmenya ndĩ mwana mwende\nNgĩkĩmenya ndĩ mwana mwende\n\nNĩ ndamenyire ndĩ mwana mwende\nRĩrĩa Ngai arutire mũriũ\nWake agĩkua mũtharaba-inĩ\nAkĩninĩra ruo rwakwa\n\nNake Jesũ akuuire ruo rwakwa\nNa akĩnina kĩrumi gĩothe\nKĩrĩa  MATEKUHOTE"},{"i":"b342","t":"RIMWE NJURAGIA NGWATANIRO YA MUNDU NA NGAI NIKIKIMITURAGIA NA MUNDU NI WA METHAHIA","c":["Praise"],"l":"Kikuyu","y":"Rĩmwe njũragia ngwatanĩro ya mũndũ na Ngai\nNĩkĩ kĩmĩtũũragia na mũndũ nĩ wa meethahia\nNa wĩhokeku wa Ngai ũtũũraga wĩ mũrũmu\nNgoria mahotanaga atĩa na mũndũ wa meethahia\n\nRĩmwe rĩrĩa Jesu onire mũtino wĩ hakuhĩ\nErire arutwo mahoe matikagwe magerio-inĩ\nTi itherũ kũhoya no kuo kũngĩtũma ngaĩrwo\nIgai rĩa wega wa Mwathani ndĩ gũkũ thĩ ĩno\n\nNĩ hinya wa mahoya ũtũmĩte hane ũguo hana\nNĩ hinya wa mahoya ũnginyũkagithia ikinya\nNdĩraga na ngagirĩka ndĩ mbere ya mũnyũmbi\nNgĩũkĩria maru makwa nyũkĩraga hootanĩte\n\nJesu atanambĩrĩrĩa wĩra wake gũkũ thĩ ĩno\nAhoeire kĩrĩma-inĩ matukũ mĩrongo ĩna\nIhoya rĩgĩtũma etirie magerio ma Ngoma\nO na e mũrũ wa Ngai nĩ ihoya rĩamũteithirie\n\nKaĩ arĩ maita maigana ndanokĩra ndĩ mũmaku\nNgarigwo tondũ rĩu nĩ gwakĩa ngwambĩrĩria ha\nNgirangirĩte ngahũrĩrwo thimũ ngahahũrwo\nNgaigua ta ingĩcooka mĩrengeti-inĩ ngakuĩre kuo\n\nIhoya rĩa Danieli rĩatũmire Israeli\nMarutwo ũkombo-inĩ wa mĩaka mĩrongo mũgwanja\nMakĩinuka monaga ta mararota mũthenya\nNĩ thĩna ũrĩkũ ũcio ũngĩtiria hinya wa mahoya\n\nŨyũ nĩ mũtumia wa ndigwa atigirwo tene\nIci nĩ ciana cia ngoriai aciari nĩ makuire\nIthe na nyina wa ciana cia ndigwa arĩ o gĩtĩ-inĩ\nŨrĩa watũmirĩ Hannah etwo nyina wa rũrĩrĩ\n\nGũtirĩ kĩheo gĩkĩrĩte gĩkĩ waheire\nGĩa gũgwĩtaga ndĩ thĩ ũkanjĩtĩka wĩ matu-inĩ\nGũtirĩ kĩheo gĩkĩrĩte gĩkĩ waheire\nGĩa gũgwĩtaga na mwĩrĩ ũkanjĩtĩka na roho\n\nNĩkĩo andũ makĩhoka hinya wa indo na wa ũtonga\nNiĩ nĩ njũĩ he kũndũ njĩtanaga ngetĩkwo\nNgũtũũra njitaga maithori mbere ya mũnyũmbi\nNgũtũũra ndĩnyihĩtie mbere ya ũrĩa ũndeithagia\n\nWĩra wakwa nĩ gũtũũra njetagĩrĩra Ngai\nNa itanarĩkia kũmweterera ngamweterera\nWĩra wakwa nĩ gũtũũra ndĩhokete Mũrungu\nNa itanarĩkia kũmwĩhoka ngamwĩhoka rĩngĩ\n\nWĩra wakwa nĩ gũtũũra njetagĩrĩra Ngai\nNa itanarĩkia kũmweterera ngamwetera\nWĩra wakwa nĩ wa gũtũũra ndĩhokete o Mũrungu\nNa itanarĩkia kũmwĩhoka ngamwĩhoka rĩngĩ"},{"i":"b343","t":"THIKIRIRIAI INYUOTHE MWAMURIRUO NI NGAI MINYAMARO IRIA MUGUTUNGA","c":["Praise"],"l":"Kikuyu","y":"Gikeno Kinene\n\nThikiririai inyuothe mwamuritwo ni Ngai; minyamaro iria mugutunga\nnigukiririria kwanyu gugaatuma; mukaheo muoyo na uthamaki.\n\nGikeno kinene gikeno njigiiruo kiria nganengererio ni Mwathani\nacoke oye thumbi anjikire mutwe; nigukiririra minyamaro.\n\nPaulo na Sila hindi iria maikirio; Korokoro-ini niundu wa mwathani\nmatiacuthitiirie maundu ma thi-ino indi macuthiriireie uthamaki.\n\nKuu tuthiaga gutiri maithori tugakenanira na Messia; minyamaro iitu niikariganira kuu no gikeno Halleluya.\n\nJonana nionirio aria megutoria; uria magakorwo magemetio\nmagekiruo thumbi na nguo cia uhiki; na maheo ritwa ringi rieru.\n\nAwa niagakena acuthiriria atheru amenya wira wa muriu ti wa tuhu\nna Jesu akene acuthiriria atheru amenya magetha ni mainuka."},{"i":"b344","t":"THOOGORA WA MUOYO THAOGAORA WA MUOYO WATHOGORIRUO NUU","c":["Praise"],"l":"Kikuyu","y":"Thogora wa muoyo,\nThogora wa muoyo wathogorirwo nuu\nNa ndiari wa muoyo ini, ndiabatii gutura ndagiriire oo gukua\nNi kwendwo ndendiro ngirekerwo mehia\nNgikiririo waganu wakwa woothe\nIngiuga ndari mwega kuu no kwihenia ni tha ndaiguiriirwo\n\n(Mutharaba)\nNi mutharaba ini mutharabaini\nNiho ndarutire thayu wakwa wooothe\nGikeno giakwa, thayu uyu ndinaguo\nCiothe ndacirutire calvary\nMutharabaini,\nNi mutharabaini,\nMutharabaini niho thina wakwa wothe wathiriire\n\nKindu giothe kiega nikiri thogora\nNikinogagirwo, nikio muoyo wakwa waitiirwo thakame\nMundu utari wehia, akiambwo mutiini\nMwana wa rwendo Ngai akireka akue\nIngiuga ndari mwega kuu no kwihenia ni tha ndaiguiriirwo\n\nHindi iria mugendi,\nHindi iria mugendi onire mehia make\nAkiuria muhunjia, muhunjia wa uhoro ingigiteithika atia\nMuhunjia wa uhoro akioya mugendi, akimuonererai mutharabaini\nTi kiyo ini giitu, ti mbeca ini ciitu ni mutharaba ini\n\nReu ndi mugendi,\nReu ndi mugendi :"Kikuyu","y":"GUTIRI MUGWI WA MBAARA\nBy Karangu Muraya\n\nŪhoro wa, mūndū mūthingu\nJehovah ekuuga atī,\nNī gūtūma agatūma, wīhande wega;\nNa igai rīrīa, Ngai akamūhe,\nNī kūmwehereria kīmako gīake\nAgitware haraya nake.\n\nGūtirī mūgwī wa mbaara,\nŪharīrīirio mūndū mūthingu\nŪkagacīra wīra-inī waguo;\nGūtirī mūgwī wa mbaara,\nŪharīrīirio mūndū mūthingu\nŪkagacīra wīra-inī waguo.\n\nNgai akonania, atī nīamwendete\nAmūteithia ahootane, cira icirithīrio-inī\nria thū ciake,\nNa ningī mwara,hūri wa ngūūī,\nNa indo ciothe iria athondekete cia mbaara, ciothe aciagithie hinya.\n\nJehovah ekuuga, onangīkorwo\nNīwe wombire arīa eki ūūru\nNa nowe ūmekīraga hinya,\nNdangītīkīra hinya ũcio wao,\nŪkīīrīre ūthingu arī guo gītugī\ngīa gūtūūria andū othe muoyo.\n\nRūirigo rūrū, rwaku rwa ūthingu,\nNgai thiūrūrūkīria, na ndūkanareke niī ngoima nja yaruo,\nNingī Ngai ū,ndūagīrīre, mīgwī yothe\nndūkareke īkinye rūthingo-inī ītainīkangīte.\n\nMīgwī yothe, ya mathīna,\nMīrimū nayo gūthingithia mīciī\nna kwagithia ngoro thayū,\nJehovah ekuuga aatīrīrī,\nGūtirī mūgwī wa mbaara,\nŪharīrīirio mūndū mūthingu\nŪkagacīra wīra-inī waguo."},{"i":"b351","t":"UKAI MWONE JESU NI MWEGA UKAI MWONE JESU NI MWEGA","c":["Praise"],"l":"Kikuyu","y":"UKAI MWONE JESU NI MWEGA UKAI MWONE JESU NI MWEGA"},{"i":"b352","t":"URATHII NIWARATHIRUO NI ISAIAH,AKIUGA ATI NIGUGACIARWO MUANA","c":["Praise"],"l":"Kikuyu","y":"Ũrathi nĩ warathirwo nĩ Isaiah\nAkiuga atĩ nĩ gũgaciarwo mwana\nŨnene wothe ũgakorwo ciande-inĩ ciake\nŨmenyi ũgakorwo kanua-inĩ gake\n\nJesũ, rĩtwa rĩrĩa nyenda kũigua\nJesũ, rwĩmbo rũrĩa nyenda kũina\nJesũ rũgano rũrĩa niĩ kwenda kũgana\nNĩ rwa tene\nNo nĩ rwerũ oro mũthenya\n\nAciarwo nĩ aheirwo marĩtwa maingĩ\nImmanueli, ũyũ nĩ Ngai hamwe na ithuĩ\nNĩ mũheani kĩrĩra wa kũgegania\nBaba witũ wa tene na tene\n\nAkũra, arutire mawĩra maingĩ\nNa kũhonia andũ aingĩ mĩrimũ mĩũru\nO na akĩingata ndaimono\nIkiuma kũrĩ andũ\nMarigĩrĩrio akĩambũo mũtĩ-inĩ\n\nRwĩtwa-inĩ rĩĩrĩ harĩ ũtonga mũingĩ\nTwahoya na rĩtwa rĩĩrĩ tũkoona\nTwakũũma ngoma\nRĩtwa-inĩ rĩĩrĩ ikoima andũ\nNa no rĩo tũgeetaga twĩrathime\n\nĨĩ no rĩo rĩtwaragĩrĩria he ithe\nRĩkĩambanagia mahoya maitũ\nNĩguo twetana twĩ thĩ tũgetĩkũo igũrũ\nJesũ, kĩheyo twaheirwo twĩ thĩ\n\nJesũ, rĩtwa rĩ goro kwĩ mothe\nJesũ, ihiga rĩrĩa rĩa koine\nJesũ mũrango, nĩwe itonyero rĩa arĩa othe\nMegũtoonya makĩingĩra ũthamaki"},{"i":"b353","t":"WAGIRIIRE NGAI WAGIRIIRE WAGIRIIRE NGAI WAGIRIIRE","c":["Praise"],"l":"Kikuyu","y":"WAGIRIIRE NGAI WAGIRIIRE WAGIRIIRE NGAI WAGIRIIRE"},{"i":"b354","t":"WEH IMANUELI MWIKI WA MAYA GUTIRI KIRIMA KINGIKUGITIRA HINYA WEE WI NGAI","c":["Praise"],"l":"Kikuyu","y":"Weeh emanueli mwiki wa maya\nGutiri kirima kingikugitira hinya wi Ngai\nMwikirani hinya muhonania\nGutiri kirima kingikugitira hinya wi Ngai\n\nKiara giaku niki nguithagiria\nThu ciakwa ikamomoka mwena uyu ngiri na uyu ngiri ikumi\nGuoko gwaku kundindikagira\nThu ciakwa ikamomoka mwena uyu ngiri na uyu ngiri ikumi\n\nWarahukaga ukanduirira\nGutiri kirima kingikugitira hinya wi Ngai\nNgikinya muico weeh ndukinyaga\nGutiri kirima kingikugitira hinya wi Ngai\n\nIngigua unjoyaga na wendo\nGutiri kirima kingikugitira hinya wi Ngai\nNderereka niundugamagia\nGutiri kirima kingikugitira hinya wi Ngai\n\nNiundu uriku muritu hari wee\nGutiri kirima kingikugitira hinya wi Ngai\nThiina wakwa nitaki hari wee\nGutiri kirima kingikugitira hinya wi Ngai\n\nNa ti itheru wi muheani\nGutiri kirima kingikugitira hinya wi Ngai\nNjamba ya ita nirio ritwa riaku\nGutiri kirima kingikugitira hinya wi Ngai"},{"i":"b355","t":"WI MUCAMO UTATHIRA ,MWITUO UTANOGAGA,MUHEANI UTAORAGA NGORO ,MWIRANIRI UHINGAGIA","c":["Praise"],"l":"Kikuyu","y":"Wĩ mũcamo ũtathiraga\nMwĩtwo ũtanogaga\nMũheani ũtairaga ngoro\nMwĩranĩri ũhingagia\n\nIgũrũ nĩ kũmemerekia\nNdĩmemerekagia riiri waku\nMũtambũrũko wa matu ngonania\nWĩra wa moko maku\n\nMũthenya nĩ ũkinyagĩria\nMũthenya ũngĩ ũhoro\nŨtukũ naguo ũgagĩkinyĩria\nŨtukũ ũyũ ũngĩ ũmenyo\n\nchorus\n\nMwĩhoko witũ no kũrĩ wee\nW   else if(btn)t='Tap the button below to install.';
  else if(location.protocol!=='https:'&&location.hostname!=='localhost')t='This page is not opened from a secure https link, so it cannot be installed. Open your GitHub link, which starts with https://.';
  else if(inApp())t='You opened this inside another app (WhatsApp, Facebook or similar). Tap the ⋮ or share icon and choose "Open in Chrome" (or Safari on iPhone), then try again.';
  else if(isIOS())t='On iPhone, open this link in Safari, tap the Share icon, then choose "Add to Home Screen". Other browsers on iPhone cannot install apps.';
  else t='Your browser has not offered the install button yet. Tap the ⋮ menu in Chrome and choose "Install app" or "Add to Home screen". If neither appears, close Chrome completely, open the link again, wait 10 seconds and check the menu again.';
  $('insthelp').textContent=t;$('inst').style.display=btn?'block':'none';$('instbox').style.display=isStandalone()?'none':'block';
}
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferred=e;render();instState()});
window.addEventListener('appinstalled',function(){deferred=null;render();instState();toast('Nyimbo installed')});
$('inst').onclick=function(){if(!deferred)return;deferred.prompt();deferred.userChoice.then(function(){deferred=null;instState();render()},function(){})};
$('mback').onclick=function(){$('mn').classList.remove('on');render()};
$('exp').onclick=function(){
  var data=JSON.stringify({app:'nyimbo',songs:songs},null,1);
  if(dl){dl.save({filename:'nyimbo-backup.json',data:data}).then(function(){toast('Backup saved')},function(e){if(!e||e.code!=='declined')toast('Could not save the backup')});}
  else{try{navigator.clipboard.writeText(data).then(function(){toast('Backup copied. Paste it into a note to keep it.')},function(){toast('Could not copy the backup')});}catch(e){toast('Could not copy the backup')}}
};
$('imp').onclick=function(){$('file').click()};
$('file').onchange=function(){
  var f=this.files[0];this.value='';if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result),arr=Array.isArray(d)?d:d.songs,n=0;
      if(!Array.isArray(arr))throw 0;
      var map=titleMap(),ps=[],added=0,merged=0,byId={};
      songs.forEach(function(x){byId[x.id]=x});
      arr.forEach(function(s){
        if(!s||!s.title)return;
        var cs=Array.isArray(s.cats)&&s.cats.length?s.cats.map(String):[String(s.cat||'Worship')];
        var song={id:(s.id&&String(s.id))||newId(),num:String(s.num||''),title:String(s.title).toUpperCase(),cat:cs[0],cats:cs,lyrics:String(s.lyrics||''),lang:String(s.lang||'')};
        if(byId[song.id]){ps.push(put(song));map[normT(song.title)]=song;added++;return;}
        var p=addOrMerge(song,map);if(p){ps.push(p);if(map[normT(song.title)]===song)added++;else merged++;}
      });
      Promise.all(ps).then(function(){toast('Restored '+added+' songs'+(merged?', merged '+merged+' repeats':''));render();});
    }catch(e){toast('That file is not a Nyimbo backup')}
  };
  r.readAsText(f);
};

/* ---- light up capabilities when present ---- */
render();
(function(){
  if(window.claude&&claude.use)claude.use('downloads').then(function(d){dl=d||null}).catch(function(){});
})();
try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(function(){});}catch(e){}
</script>
